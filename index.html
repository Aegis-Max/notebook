<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#15543f" />
    <title>康奈尔笔记</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315543f'/%3E%3Cpath d='M5 8c0-1.1.9-2 2-2h5c1.8 0 3.2.7 4 2 0.8-1.3 2.2-2 4-2h5c1.1 0 2 .9 2 2v16l-6-.4c-2-.1-3.7.7-5 2.2-1.3-1.5-3-2.3-5-2.2L5 24V8Z' fill='white'/%3E%3Cpath d='M16 8v17' stroke='%2315543f'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell" id="app-shell" data-testid="app-shell">
      <header class="topbar" id="topbar" data-testid="topbar">
        <a class="brand" href="#editor" aria-label="康奈尔笔记首页，当前版本 1.0" data-testid="brand">
          <svg class="brand-icon" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M3.5 6.7c0-1.5 1.2-2.7 2.7-2.7h5.3c2 0 3.6.7 4.5 2.1.9-1.4 2.5-2.1 4.5-2.1h5.3c1.5 0 2.7 1.2 2.7 2.7v18.1c0 1-.9 1.8-1.9 1.7l-5.9-.4c-1.6-.1-3.2.5-4.2 1.8l-.5.6-.5-.6c-1-1.3-2.6-1.9-4.2-1.8l-5.9.4c-1 .1-1.9-.7-1.9-1.7V6.7Z" fill="currentColor" />
            <path d="M16 6.2v20.9" fill="none" stroke="#15543f" stroke-width="1.35" />
          </svg>
          <span>康奈尔笔记</span>
          <span class="app-version" id="app-version" data-testid="app-version" aria-hidden="true">v1.0</span>
        </a>

        <div class="save-status" id="save-status" data-testid="save-status" role="status" aria-live="polite">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9.25" fill="currentColor" />
            <path d="m8 12.1 2.35 2.35L16.4 8.7" fill="none" stroke="#15543f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span id="save-status-text">已保存</span>
        </div>

        <button
          class="icon-button mobile-menu-button"
          id="utility-menu-toggle"
          data-testid="utility-menu-toggle"
          type="button"
          aria-label="打开工具菜单"
          aria-controls="utility-menu"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="5" r="1.8" fill="currentColor" />
            <circle cx="12" cy="12" r="1.8" fill="currentColor" />
            <circle cx="12" cy="19" r="1.8" fill="currentColor" />
          </svg>
        </button>

        <nav class="tools-menu" id="utility-menu" data-testid="utility-menu" aria-label="笔记工具">
          <button class="tool-button" id="import-button" data-testid="import-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 16v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>导入</span>
          </button>
          <button class="tool-button" id="export-button" data-testid="export-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 15V4m0 0L8 8m4-4 4 4M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>导出</span>
          </button>
          <span class="tool-divider" aria-hidden="true"></span>
          <button class="tool-button" id="print-button" data-testid="print-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 8V3h10v5M7 17H5a2 2 0 0 1-2-2v-4a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v4a2 2 0 0 1-2 2h-2m-10-4h10v8H7v-8Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>打印</span>
          </button>
          <button class="tool-button delete-note-button" id="delete-note-button" data-testid="delete-note-button" type="button" title="删除当前笔记">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>删除</span>
          </button>
        </nav>

        <input
          class="visually-hidden"
          id="import-file"
          data-testid="import-file"
          type="file"
          accept="application/json,.json"
          tabindex="-1"
          aria-label="选择要导入的康奈尔笔记 JSON 文件"
        />
      </header>

      <div class="workspace">
        <aside class="sidebar" id="sidebar" data-testid="sidebar" aria-label="笔记库">
          <button class="new-note-button" id="new-note-button" data-testid="new-note-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 4v16M4 12h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            <span>新建笔记</span>
          </button>

          <div class="search-control">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.6" cy="10.6" r="6.4" fill="none" stroke="currentColor" stroke-width="1.8" />
              <path d="m15.4 15.4 4.3 4.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            <label class="visually-hidden" for="search-input">搜索笔记</label>
            <input id="search-input" data-testid="search-input" type="search" placeholder="搜索笔记" autocomplete="off" />
            <button
              class="mobile-list-toggle"
              id="mobile-list-toggle"
              data-testid="mobile-list-toggle"
              type="button"
              aria-label="展开笔记列表"
              aria-controls="notes-index"
              aria-expanded="false"
            >
              <svg class="search-chevron" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m7 9.5 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>

          <div class="notes-index" id="notes-index">
            <h2 id="note-list-heading">全部笔记</h2>
            <nav aria-label="全部笔记">
              <ul class="note-list" id="note-list" data-testid="note-list"></ul>
            </nav>
            <p class="note-list-empty" id="note-list-empty" data-testid="note-list-empty" hidden>没有找到匹配的笔记</p>
          </div>
        </aside>

        <main class="editor" id="editor" data-testid="editor">
          <section class="editor-meta" aria-label="当前笔记信息">
            <label class="title-field" for="note-title">
              <span class="visually-hidden">笔记标题</span>
              <input id="note-title" data-testid="note-title" type="text" value="" placeholder="未命名笔记" maxlength="120" autocomplete="off" />
            </label>
            <label class="date-field" for="note-date">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 3v3m10-3v3M4 9h16M6 5h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span class="visually-hidden">笔记日期</span>
              <span class="date-display" id="note-date-display" aria-hidden="true"></span>
              <input id="note-date" data-testid="note-date" type="date" value="" aria-label="笔记日期" required />
            </label>
          </section>

          <article class="cornell-paper" id="cornell-paper" data-testid="cornell-paper" aria-label="当前康奈尔笔记">
            <div class="paper-holes" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span><span></span><span></span>
            </div>

            <div class="cornell-grid">
              <section class="note-section notes-section" aria-labelledby="notes-heading">
                <header class="section-heading">
                  <span class="section-icon notes-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                      <path d="m4 20 4.6-1.1L19.3 8.2a2.2 2.2 0 0 0 0-3.1l-.4-.4a2.2 2.2 0 0 0-3.1 0L5.1 15.4 4 20Zm10.1-13.6 3.5 3.5M5.3 15.2l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                  </span>
                  <h2 id="notes-heading">课堂笔记</h2>
                </header>
                <textarea
                  class="section-editor notes-editor"
                  id="notes-input"
                  data-testid="notes-input"
                  aria-labelledby="notes-heading"
                  spellcheck="true"
                  placeholder="记录课堂内容、重要概念和例子……"
                ></textarea>
              </section>

              <section class="note-section cues-section" aria-labelledby="cues-heading">
                <header class="section-heading">
                  <span class="section-icon cues-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="9" fill="currentColor" />
                      <path d="M9.8 9.1a2.35 2.35 0 1 1 3.7 1.92c-.95.65-1.5 1.12-1.5 2.48M12 17.2h.01" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" />
                    </svg>
                  </span>
                  <h2 id="cues-heading">线索与问题</h2>
                </header>
                <textarea
                  class="section-editor cues-editor"
                  id="cues-input"
                  data-testid="cues-input"
                  aria-labelledby="cues-heading"
                  spellcheck="true"
                  placeholder="写下关键词、提示和复习问题……"
                ></textarea>
              </section>

              <section class="note-section summary-section" aria-labelledby="summary-heading">
                <header class="section-heading">
                  <span class="section-icon summary-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                      <path d="M8 6h12M8 12h12M8 18h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                      <circle cx="4" cy="6" r="1.35" fill="currentColor" />
                      <circle cx="4" cy="12" r="1.35" fill="currentColor" />
                      <circle cx="4" cy="18" r="1.35" fill="currentColor" />
                    </svg>
                  </span>
                  <h2 id="summary-heading">总结</h2>
                </header>
                <textarea
                  class="section-editor summary-editor"
                  id="summary-input"
                  data-testid="summary-input"
                  aria-labelledby="summary-heading"
                  spellcheck="true"
                  placeholder="用几句话总结这篇笔记……"
                ></textarea>
              </section>
            </div>
          </article>

          <div class="editor-footer-status" id="editor-footer-status" data-testid="editor-footer-status" aria-hidden="true">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="currentColor" />
              <path d="m8 12.1 2.35 2.35L16.4 8.7" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>已保存 · 自动保存中</span>
          </div>
        </main>
      </div>
    </div>

    <dialog class="confirm-dialog" id="delete-dialog" data-testid="delete-dialog" aria-labelledby="delete-dialog-title" aria-describedby="delete-dialog-description">
      <form method="dialog">
        <svg class="dialog-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <h2 id="delete-dialog-title">删除这篇笔记？</h2>
        <p id="delete-dialog-description"><span id="delete-note-name">这篇笔记</span>将从当前设备移除，且无法撤销。</p>
        <div class="dialog-actions">
          <button class="secondary-button" id="delete-cancel-button" data-testid="delete-cancel-button" type="button">取消</button>
          <button class="danger-button" id="delete-confirm-button" data-testid="delete-confirm-button" type="button">删除</button>
        </div>
      </form>
    </dialog>

    <div class="toast-region" id="toast-region" data-testid="toast-region" aria-live="polite" aria-atomic="true">
      <div class="toast" id="toast" data-testid="toast" role="status" hidden></div>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
